<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Hug Day</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff0f3; overflow: hidden; font-family: 'Poppins', sans-serif; }
        #bg-hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .bg-heart { position: absolute; bottom: -50px; animation: floatUp linear infinite; opacity: 0.4; color: #ff758f; pointer-events: none; }
        @keyframes floatUp { to { transform: translateY(-120vh) rotate(360deg); opacity: 0; } }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); border-radius: 25px; padding: 40px; text-align: center; width: 340px; z-index: 10; border: 2px solid white; box-shadow: 0 0 50px rgba(255, 77, 109, 0.2); animation: glow 3s infinite ease-in-out; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 30px rgba(255, 77, 109, 0.2); } 50% { box-shadow: 0 0 60px rgba(255, 77, 109, 0.5); } }
        #hugBtn { background: #ff4d6d; color: white; border: none; padding: 15px 35px; border-radius: 50px; cursor: pointer; font-size: 1.3rem; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 20px; z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,0.2); width: 80%; max-width: 400px; text-align: center; border: 5px solid #ffcad4; }
        .coupon { border: 3px dashed #ff4d6d; padding: 20px; border-radius: 10px; background: #fff5f7; margin: 15px 0; }
    </style>
</head>
<body>
    <audio id="bgMusic" loop src="music.mp3"></audio>
    <div id="bg-hearts"></div>
    <div class="glass">
        <h1 style="color: #ff4d6d; text-shadow: 1px 1px 2px white;">🤗 Hug Vault</h1>
        <p id="status" style="color: #ff758f;">Hold for a love squeeze...</p>
        <button id="hugBtn">Send a Hug</button>
        <p style="color: #ff758f; font-weight: bold; margin-top: 15px;">Hugs: <span id="count">0</span> | Streak: <span id="streak">0</span></p>
    </div>

    <div id="modal" class="modal">
        <h2 style="color: #ff4d6d;">💌 Love Letter</h2>
        <p id="modalText" style="color: #555; line-height: 1.6;"></p>
        <button onclick="closeModal()" style="background: #ff758f; color: white; border: none; padding: 8px 20px; border-radius: 20px;">Close</button>
    </div>

    <div id="surprise" class="modal">
        <h2 style="color: #ff4d6d;">🎟️ SPECIAL COUPON</h2>
        <div id="coupon-to-save" class="coupon">
            <h3 id="couponGift"></h3>
            <p>Redeemable for one cozy Online date! ❤️</p>
        </div>
        <button onclick="saveCouponAsImage()" style="background: #ff4d6d; color: white; border: none; padding: 10px 25px; border-radius: 20px;">Save Coupon</button>
    </div>

    <script>
        const bg = document.getElementById('bg-hearts');
        function spawnBGHeart() {
            const h = document.createElement('div');
            h.innerHTML = '❤️'; h.className = 'bg-heart';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 5 + 5) + 's';
            bg.appendChild(h);
            setTimeout(() => h.remove(), 10000);
        }
        setInterval(spawnBGHeart, 400);

        let count = 0, streak = 0, holdStart;
        const letters = { 
            5: "Every hug from you feels like home Mochi Balls. 🏠❤️", 
            10: "You're my favorite thought, You are always on my mind. 💭✨", 
            15: "I love you more than words can say, my goddess. 🗣️❌", 
            20: "You're the best part of my day, My day starts with you love! ☀️💖", 
            25: "25 Hugs! My heart belongs to you. Try holding the Button longer! 🔐❤️" 
        };
        const gifts = ["One Cozy Online Movie Night 🍿"];

        const btn = document.getElementById('hugBtn');
        btn.onpointerdown = () => { holdStart = Date.now(); document.getElementById('bgMusic').play(); };
        btn.onpointerup = () => {
            const dur = Date.now() - holdStart;
            count++;
            if (dur > 2000) streak++; else streak = 0;
            document.getElementById('count').innerText = count;
            document.getElementById('streak').innerText = streak;
            if (letters[count]) showModal(letters[count]);
            if (streak === 3) {
                document.getElementById('couponGift').innerText = gifts[0];
                document.getElementById('surprise').style.display = 'block';
                streak = 0;
            }
        };

        function showModal(t) { document.getElementById('modalText').innerText = t; document.getElementById('modal').style.display = 'block'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeSurprise() { document.getElementById('surprise').style.display = 'none'; }

        function saveCouponAsImage() {
            const coupon = document.getElementById('coupon-to-save');
            html2canvas(coupon, { useCORS: true, backgroundColor: "#fff5f7" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Love_Coupon.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                closeSurprise();
            }).catch(err => {
                alert("Please try on a live website/server! Local files might block saving.");
            });
        }
    </script>
</body>
</html>
